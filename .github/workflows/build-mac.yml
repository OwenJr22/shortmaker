name: Fabriquer ShortMaker pour Mac

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-latest   # Mac Apple Silicon (M1, M2, M3, M4…)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Télécharger FFmpeg (Apple Silicon)
        run: |
          mkdir -p ffmpeg_bin
          for tool in ffmpeg ffprobe; do
            curl -fsSL -o "$tool.zip" "https://ffmpeg.martin-riedl.de/redirect/latest/macos/arm64/release/$tool.zip"
            unzip -o -q "$tool.zip" -d ffmpeg_bin
          done
          chmod +x ffmpeg_bin/*
          ffmpeg_bin/ffmpeg -hide_banner -filters | grep -E " ass " || (echo "FFmpeg sans libass" && exit 1)

      - name: Fabriquer l'app
        run: >
          pyinstaller --noconfirm --clean --windowed --name ShortMaker
          --osx-bundle-identifier com.shortmaker.app
          --add-data "static:static" --add-data "fonts:fonts"
          --add-binary "ffmpeg_bin/ffmpeg:ffmpeg" --add-binary "ffmpeg_bin/ffprobe:ffmpeg"
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --collect-data cv2 --collect-submodules yt_dlp
          app.py

      - name: Tester l'app
        run: dist/ShortMaker.app/Contents/MacOS/ShortMaker --selftest

      - name: Emballer
        run: |
          cp LISEZMOI-MAC.txt dist/LISEZMOI.txt
          mkdir -p pack && cp -R dist/ShortMaker.app dist/LISEZMOI.txt pack/
          ditto -c -k --sequesterRsrc pack ShortMaker-Mac.zip
          ls -lh ShortMaker-Mac.zip

      - name: Publier le téléchargement
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: ShortMaker Mac (version ${{ github.run_number }})
          body: "Télécharge **ShortMaker-Mac.zip** ci-dessous, puis suis LISEZMOI.txt."
          files: ShortMaker-Mac.zip
          make_latest: true
